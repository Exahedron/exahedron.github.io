<!DOCTYPE html>
<html>
<head>
    <title>Exahedron's Website</title>
    <style>
        body {
            background: radial-gradient(circle,#000000,#03030a,#00050C);
            color: white;
            font-family: Inter, sans-serif;
            margin-top: 25px;
        }
        h1 {
            text-align: center;
            font-weight: 200;
            letter-spacing: 5px;
            white-space: nowrap;
            position: absolute;
            font-size: 2.25em;
            margin: 0;
        }
        .square {
            position: relative;
            width: 100px;
            height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .square::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;        
            height: 100%;       
            box-sizing: border-box;
            background-color: transparent;
            border: 3px solid #ffffff7f;
            border-radius: 2px;
            transform: rotate(-15deg);
            z-index: -1;      
        }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <center><div class="square"><h1>Exahedron</h1></div></center>
    <p>Placeholder</p>
</body>
</html>
